{% extends "base.html" %}
{% block title %}Campaigns — PulsePilot AI{% endblock %}

{% block content %}
<div class="p-6 lg:p-8 max-w-5xl mx-auto w-full space-y-6">

  <!-- Header -->
  <div class="flex items-start justify-between">
    <div>
      <h1 class="text-2xl font-bold text-white tracking-tight">Campaign Dispatcher</h1>
      <p class="text-slate-400 text-sm mt-1">Live multi-channel delivery tracking — auto-refreshes every 3 seconds.</p>
    </div>
    <a href="/strategist"
      class="flex items-center gap-2 rounded-xl bg-gradient-to-r from-brand-purple to-brand-red px-4 py-2.5 text-sm font-semibold text-white hover:opacity-90 transition-all shadow-md shadow-purple-950/20">
      <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
      </svg>
      New Campaign
    </a>
  </div>

  <!-- Campaign list with polling -->
  <div id="campaigns-list"
       hx-get="/htmx/campaigns/list"
       hx-trigger="load, every 3s"
       hx-swap="innerHTML">
    <div class="flex justify-center py-16">
      <svg class="h-6 w-6 animate-spin text-purple-500" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
      </svg>
    </div>
  </div>

</div>
{% endblock %}
