{% if error %}
<div class="flex items-center gap-2 text-sm text-red-400">
  <svg class="h-4 w-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
    <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z" />
  </svg>
  <span>{{ error_msg }}</span>
</div>
{% else %}
<div class="flex items-start gap-3">
  <div class="flex h-8 w-8 items-center justify-center rounded-full bg-purple-950/50 text-purple-300 border border-purple-800/30 text-sm shrink-0 mt-0.5 shadow-sm">✦</div>
  <p class="text-sm text-slate-300 leading-relaxed italic">"{{ summary }}"</p>
</div>
{% endif %}
